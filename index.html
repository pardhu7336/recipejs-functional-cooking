<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecipeJS - Your Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍳 RecipeJS</h1>
    <p>Your Functional Cooking Companion</p>
    <input id="search-input" type="text" placeholder="Search recipes..." />
    <button id="clear-search" hidden>Clear</button>
  </header>

  <main>
    <div class="recipe-controls">
      <button id="favorites-filter">Favorites Only</button>
      <span id="recipe-counter">Showing 0 of 0 recipes</span>
    </div>

    <div id="recipe-container">
      <!-- Recipe cards will render here -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
